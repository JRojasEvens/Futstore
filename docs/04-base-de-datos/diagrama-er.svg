SERIAL</text><text x="385" y="395" font-size="12" font-family="Courier, monospace" fill="#2e7d32">FK rarity_id : INT</text><text x="385" y="414" font-size="12" font-family="Courier, monospace">player_name : VARCHAR(80)</text><text x="385" y="433" font-size="12" font-family="Courier, monospace">position : VARCHAR(5)</text><text x="385" y="452" font-size="12" font-family="Courier, monospace">club : VARCHAR(60)</text><text x="385" y="471" font-size="12" font-family="Courier, monospace">nation : VARCHAR(60)</text><text x="385" y="490" font-size="12" font-family="Courier, monospace">overall : SMALLINT</text><text x="385" y="509" font-size="12" font-family="Courier, monospace">pace, shooting, passing : SMALLINT</text><text x="385" y="528" font-size="12" font-family="Courier, monospace">dribbling, defending : SMALLINT</text><text x="385" y="547" font-size="12" font-family="Courier, monospace">physical : SMALLINT</text><text x="385" y="566" font-size="12" font-family="Courier, monospace">image_url : TEXT</text><rect x="710" y="470" width="260" height="129" fill="#fff" stroke="#222" stroke-width="1.5"/><rect x="710" y="470" width="260" height="26" fill="#e0e0e0" stroke="#222" stroke-width="1.5"/><text x="840.0" y="488" text-anchor="middle" font-size="14" font-weight="bold">messages</text><text x="720" y="516" font-size="12" font-family="Courier, monospace" font-weight="bold">PK id : SERIAL</text><text x="720" y="535" font-size="12" font-family="Courier, monospace" fill="#2e7d32">FK post_id : INT</text><text x="720" y="554" font-size="12" font-family="Courier, monospace" fill="#2e7d32">FK sender_id : INT</text><text x="720" y="573" font-size="12" font-family="Courier, monospace">body : TEXT</text><text x="720" y="592" font-size="12" font-family="Courier, monospace">created_at : TIMESTAMP</text><path d="M300 100 L375 100" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="304" y="94" font-size="12" font-weight="bold" text-anchor="start">1</text><text x="371" y="94" font-size="12" font-weight="bold" text-anchor="end">N</text><path d="M635 100 L710 100" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="639" y="94" font-size="12" font-weight="bold" text-anchor="start">N</text><text x="706" y="94" font-size="12" font-weight="bold" text-anchor="end">1</text><path d="M170 50 L170 28 L840 28 L840 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="176" y="24" font-size="12" font-weight="bold" text-anchor="start">1</text><text x="834" y="24" font-size="12" font-weight="bold" text-anchor="end">N</text><text x="505" y="22" font-size="11" fill="#555" text-anchor="middle">users.id → posts.seller_id</text><path d="M300 400 L375 400" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="304" y="394" font-size="12" font-weight="bold" text-anchor="start">1</text><text x="371" y="394" font-size="12" font-weight="bold" text-anchor="end">N</text><path d="M635 380 L672 380 L672 285 L760 285 L760 255" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="639" y="374" font-size="12" font-weight="bold" text-anchor="start">1</text><text x="766" y="269" font-size="12" font-weight="bold" text-anchor="start">N</text><text x="690" y="302" font-size="11" fill="#555">cards.id → posts.card_id</text><path d="M900 255 L900 470" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="906" y="269" font-size="12" font-weight="bold" text-anchor="start">1</text><text x="906" y="464" font-size="12" font-weight="bold" text-anchor="start">N</text><path d="M40 100 L20 100 L20 630 L690 630 L690 535 L710 535" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="300" y="624" font-size="11" fill="#555">users.id → messages.sender_id (1:N)</text><text x="40" y="660" font-size="12" fill="#555">users y posts se relacionan N:M a través de favorites. Las llaves foráneas están en verde.</text></svg>