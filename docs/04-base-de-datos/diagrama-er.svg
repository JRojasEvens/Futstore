<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Helvetica, Arial, sans-serif"><rect width="1000" height="680" fill="#fff"/><rect x="40" y="50" width="260" height="148" fill="#fff" stroke="#222" stroke-width="1.5"/><rect x="40" y="50" width="260" height="26" fill="#e0e0e0" stroke="#222" stroke-width="1.5"/><text x="170.0" y="68" text-anchor="middle" font-size="14" font-weight="bold">users</text><text x="50" y="96" font-size="12" font-family="Courier, monospace" font-weight="bold">PK id : SERIAL</text><text x="50" y="115" font-size="12" font-family="Courier, monospace">username : VARCHAR(40) UNIQUE</text><text x="50" y="134" font-size="12" font-family="Courier, monospace">email : VARCHAR(120) UNIQUE</text><text x="50" y="153" font-size="12" font-family="Courier, monospace">password_hash : VARCHAR(255)</text><text x="50" y="172" font-size="12" font-family="Courier, monospace">picture : TEXT</text><text x="50" y="191" font-size="12" font-family="Courier, monospace">created_at : TIMESTAMP</text><rect x="375" y="50" width="260" height="129" fill="#fff" stroke="#222" stroke-width="1.5"/><rect x="375" y="50" width="260" height="26" fill="#e0e0e0" stroke="#222" stroke-width="1.5"/><text x="505.0" y="68" text-anchor="middle" font-size="14" font-weight="bold">favorites</text><text x="385" y="96" font-size="12" font-family="Courier, monospace" font-weight="bold">PK id : SERIAL</text><text x="385" y="115" font-size="12" font-family="Courier, monospace" fill="#2e7d32">FK user_id : INT</text><text x="385" y="134" font-size="12" font-family="Courier, monospace" fill="#2e7d32">FK post_id : INT</text><text x="385" y="153" font-size="12" font-family="Courier, monospace">created_at : TIMESTAMP</text><text x="385" y="172" font-size="12" font-family="Courier, monospace">UNIQUE (user_id, post_id)</text><rect x="710" y="50" width="260" height="205" fill="#fff" stroke="#222" stroke-width="1.5"/><rect x="710" y="50" width="260" height="26